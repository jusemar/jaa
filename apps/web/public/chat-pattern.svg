<?xml version="1.0" encoding="UTF-8"?>
<!--
  Padrão de fundo da CONVERSA do Jaa. Desenho próprio, na mesma LINGUAGEM da referência de UI/UX
  aprovada: traço fino, motivos simples de conversa e comércio, em tom quente sobre o bege do chat.

  Deliberadamente DISCRETO (opacidade 0.16): é textura atrás de texto, não decoração. O tamanho do
  ladrilho e a intensidade final são controlados pelos tokens chat-padrao em globals.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" fill="none">
  <g stroke="#B9AB79" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" opacity="0.16">
    <!-- Balão de conversa: o motivo da marca, com o canto vivo embaixo à esquerda. -->
    <path d="M16 20h26a5 5 0 0 1 5 5v13a5 5 0 0 1-5 5H27l-9 8v-8h-2a5 5 0 0 1-5-5V25a5 5 0 0 1 5-5Z" />
    <!-- Sacola de compras. -->
    <path d="M78 26h22l-2.5 24h-17L78 26Z" />
    <path d="M84 26v-4a5 5 0 0 1 10 0v4" />
    <!-- Copo com tampa. -->
    <path d="M134 24h20l-3 26h-14l-3-26Z" />
    <path d="M132 24h24" />
    <!-- Prato com talheres. -->
    <circle cx="30" cy="96" r="13" />
    <circle cx="30" cy="96" r="6" />
    <path d="M56 84v12M56 96v14M64 84c3 2 3 8 0 10v12" />
    <!-- Etiqueta de preço. -->
    <path d="M80 88l14-14h14v14l-14 14-14-14Z" />
    <circle cx="102" cy="82" r="2.4" />
    <!-- Caixa de entrega. -->
    <path d="M132 86l14-6 14 6v18l-14 6-14-6V86Z" />
    <path d="M132 86l14 6 14-6M146 92v24" />
    <!-- Alfinete de localização. -->
    <path d="M28 158c0 0 10-9 10-17a10 10 0 1 0-20 0c0 8 10 17 10 17Z" />
    <circle cx="28" cy="140" r="4" />
    <!-- Comprovante do pedido. -->
    <path d="M80 132h24v30l-6-4-6 4-6-4-6 4v-30Z" />
    <path d="M86 140h12M86 147h12" />
    <!-- Segundo balão, menor, fechando o ritmo do ladrilho. -->
    <path d="M132 136h22a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-12l-7 6v-6h-3a4 4 0 0 1-4-4v-10a4 4 0 0 1 4-4Z" />
  </g>
  <g fill="#B9AB79" opacity="0.1">
    <circle cx="62" cy="58" r="2" />
    <circle cx="120" cy="118" r="2" />
    <circle cx="10" cy="124" r="1.6" />
    <circle cx="170" cy="66" r="1.6" />
  </g>
</svg>
